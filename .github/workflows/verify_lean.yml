name: Verify Lean Files

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6.0.2

      - name: Check for sorry or axiom
        run: |
          if grep -rnw --include=\*.lean -E '\bsorry\b' . ; then
            echo "Error: Found 'sorry' in Lean files."
            exit 1
          fi
          if grep -rnw --include=\*.lean -E '\baxiom\b' . ; then
            echo "Error: Found 'axiom' in Lean files."
            exit 1
          fi
          echo "No 'sorry' or 'axiom' found in Lean files."
